spring.application.name=ssms
spring.config.import=optional:file:.env[.properties],optional:file:./ssms/.env[.properties]
spring.flyway.enabled=true

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/${DB_NAME}
spring.datasource.username=${DB_USR}
spring.datasource.password=${DB_PASSWD}

spring.jpa.show-sql=true
server.port=8082
jwt.secret=${SECRET_KEY}
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.throw-exception-if-no-handler-found=true
# Disable the default resource handling so it doesn't try to look for a "static file" 404
spring.web.resources.add-mappings=false

# Tell Flyway to 'baseline' an existing database
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate